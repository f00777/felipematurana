<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>=== FELIPE MATURANA === | Contacto</title>
  <meta name="description" content="Puertos de comunicación y canales de contacto de Felipe Maturana.">
  <meta name="author" content="Felipe Maturana">

  <!-- Retro Monospace Fonts: VT323 & Share Tech Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- BIOS Frame / Monitor Chassis -->
  <div class="bios-wrapper">
    <main class="bios-screen" id="biosScreen" role="region" aria-label="BIOS Setup Utility">

      <!-- Header Section -->
      <header class="bios-header">
        <div class="bios-header-top">
          <span class="bios-datetime" id="biosClock">FECHA: 2026-10-23  HORA: 22:20:00</span>
        </div>
        <div class="bios-title-banner">
          <h1 class="bios-title" id="pageTitle">=== FELIPE MATURANA ===</h1>
        </div>
      </header>

      <!-- Main Content Container: Contacto -->
      <section class="bios-content-area" id="contentArea">
        <div class="bios-view active" id="view-contacto">
          <div class="subview-header">
            <span class="subview-title">=== CONTACTO ===</span>
            <a href="index.html" class="bios-back-btn" id="backBtn">[ESC] VOLVER AL MENÚ</a>
          </div>
          <div class="subview-body">
            <div class="contact-channels">
              <div class="channel-card">
                <span class="channel-port">Email</span>
                <span class="channel-val"><a href="mailto:felipematuranaaraya7@gmail.com" class="bios-link">felipematuranaaraya7@gmail.com</a></span>
              </div>
              <div class="channel-card">
                <span class="channel-port">Github</span>
                <span class="channel-val"><a href="https://github.com/f00777" target="_blank" rel="noopener" class="bios-link">https://github.com/f00777</a></span>
              </div>
              <div class="channel-card">
                <span class="channel-port">Linkedin</span>
                <span class="channel-val"><a href="https://www.linkedin.com/in/felipe-maturana1/" target="_blank" rel="noopener" class="bios-link">https://www.linkedin.com/in/felipe-maturana1/</a></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Footer / Keybindings Navigation Bar -->
      <footer class="bios-footer">
        <div class="key-help-grid">
          <div class="key-item"><span class="key">[ESC]</span> Volver al Menú Principal</div>
          <div class="key-item interactive" id="soundToggleBtn"><span class="key">[M]</span> Sonido: <span id="soundStatus">ON</span></div>
        </div>
      </footer>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
