<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>=== FELIPE MATURANA === | Menú Principal</title>
  <meta name="description" content="Blog personal de Felipe Maturana con estética retro BIOS. Opciones del sistema: Sobre mí, Ensayos y Contacto.">
  <meta name="author" content="Felipe Maturana">

  <!-- Retro Monospace Fonts: VT323 & Share Tech Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="crt-enabled">
  <!-- Subtle CRT Scanlines & Screen Flicker Overlay -->
  <div class="crt-overlay" aria-hidden="true"></div>

  <!-- BIOS Frame / Monitor Chassis -->
  <div class="bios-wrapper">
    <main class="bios-screen" id="biosScreen" role="region" aria-label="BIOS Setup Utility">

      <!-- Header Section -->
      <header class="bios-header">
        <div class="bios-header-top">
          <span class="bios-datetime" id="biosClock">FECHA: 2026-10-23  HORA: 22:20:00</span>
        </div>
        <div class="bios-title-banner">
          <h1 class="bios-title" id="pageTitle">=== FELIPE MATURANA ===</h1>
        </div>
      </header>

      <!-- Main Content Container: Main Menu -->
      <section class="bios-content-area" id="contentArea">
        <div class="menu-layout">
          
          <!-- BIOS Options Menu Box -->
          <div class="menu-panel left-panel">
            <div class="panel-header">OPCIONES DEL SISTEMA</div>
            <ul class="bios-menu-list" id="mainMenuList" role="menu">
              <li role="none">
                <a href="sobre-mi.html" class="menu-item selected" data-index="0" role="menuitem" tabindex="0">
                  <span class="pointer">►</span>
                  <span class="item-number">1.</span>
                  <span class="item-label">SOBRE MÍ</span>
                </a>
              </li>
              <li role="none">
                <a href="ensayos.html" class="menu-item" data-index="1" role="menuitem" tabindex="0">
                  <span class="pointer">►</span>
                  <span class="item-number">2.</span>
                  <span class="item-label">ENSAYOS</span>
                </a>
              </li>
              <li role="none">
                <a href="contacto.html" class="menu-item" data-index="2" role="menuitem" tabindex="0">
                  <span class="pointer">►</span>
                  <span class="item-number">3.</span>
                  <span class="item-label">CONTACTO</span>
                </a>
              </li>
            </ul>
          </div>

        </div>
      </section>

      <!-- Footer / Keybindings Navigation Bar -->
      <footer class="bios-footer">
        <div class="key-help-grid">
          <div class="key-item"><span class="key">[↑/↓]</span> Mover</div>
          <div class="key-item"><span class="key">[ENTER]</span> Seleccionar</div>
          <div class="key-item"><span class="key">[1-3]</span> Acceso Rápido</div>
          <div class="key-item interactive" id="soundToggleBtn"><span class="key">[M]</span> Sonido: <span id="soundStatus">ON</span></div>
          <div class="key-item interactive" id="crtToggleBtn"><span class="key">[C]</span> Modo CRT: <span id="crtStatus">ON</span></div>
        </div>
      </footer>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
